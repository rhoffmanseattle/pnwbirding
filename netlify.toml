[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/ebird"
  to = "/.netlify/functions/ebird"
  status = 200

# Old routes (submitted to Google via the original sitemap) -> new /spots/ routes
[[redirects]]
  from = "/locations/union-bay-natural-area/*"
  to = "/spots/union-bay-natural-area/"
  status = 301

[[redirects]]
  from = "/locations/discovery-park/*"
  to = "/spots/discovery-park/"
  status = 301

